spring:
  application:
    name: manufacturing-engineering-intelligence
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/mei_platform}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:KzVwQ1d0NWVXOGZqNUcyK1E0RHRjYVRVbTVrRUpYVXpKVG1XWThvTzJBVT0=}
  expiration: 86400000 # 24 hours in milliseconds

ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}

app:
  seed-default-users: ${SEED_DEFAULT_USERS:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always